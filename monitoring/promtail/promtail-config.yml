server:
  http_listen_port: 9080

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        # Promtail 3.0's Docker reader ignores the relabel keep result and sends
        # excluded containers with empty labels. Filter before creating readers.
        filters:
          - name: label
            values: ["logging=promtail", "com.docker.compose.project=aoriarh"]
    relabel_configs:
      - target_label: job
        replacement: aoriarh-docker
      # Nom du service comme label
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      # Label service depuis docker-compose
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
    pipeline_stages:
      # Parser les logs JSON structurés
      - json:
          expressions:
            level: level
      - labels:
          level:
      # Keep event in the original log, not in the stream labels: it may contain
      # arbitrary messages/IDs and would create unbounded stream cardinality.
