global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "incident-notifier"
    static_configs:
      - targets: ["incident-notifier:9117"]
  - job_name: "public-probe"
    static_configs:
      - targets: ["public-probe:9116"]
  - job_name: "backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "aoriarh-backend"
