name: Documentary source access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public official sources
        shell: python
        run: |
          import urllib.request, pathlib, json
          out = pathlib.Path('source-access'); out.mkdir()
          urls = {
            'ameli-at': 'https://www.ameli.fr/entreprise/vos-salaries/accident-travail-trajet/demarches',
            'ameli-arret': 'https://www.ameli.fr/entreprise/vos-salaries/arret-de-travail/formalites-employeur',
            'ameli-subrogation': 'https://www.ameli.fr/entreprise/vos-salaries/arret-de-travail/subrogation-salaire',
            'urssaf-cse': 'https://www.urssaf.fr/files/live/sites/urssaffr/files/outils-documentation/guides/Guide-CSE.pdf',
            'urssaf-dpae': 'https://www.urssaf.fr/accueil/employeur/embaucher-gerer-salaries/embaucher/declaration-prealable-embauche.html',
          }
          results = []
          for key, url in urls.items():
            try:
              req = urllib.request.Request(url, headers={'User-Agent': 'AORIA-documentary-review/1.0'})
              with urllib.request.urlopen(req, timeout=30) as response:
                raw = response.read(8000001)
                if len(raw) > 8000000: raise ValueError('Source too large')
                (out / (key + '.raw')).write_bytes(raw)
                results.append({'key': key, 'url': url, 'status': response.status, 'bytes': len(raw)})
            except Exception as exc:
              results.append({'key': key, 'url': url, 'error': str(exc)})
          (out / 'results.json').write_text(json.dumps(results, indent=2))
          print(json.dumps(results, indent=2))
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check with a normal browser
        run: |
          cat > /tmp/browser.mjs <<'JAVASCRIPT'
          import {spawn} from 'node:child_process';
          import {mkdtempSync,writeFileSync,rmSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          const profile=mkdtempSync(tmpdir()+'/aoria-public-source-');
          const chrome=spawn('google-chrome',['--headless=new','--no-sandbox','--remote-debugging-port=9358',`--user-data-dir=${profile}`,'--no-first-run','--no-default-browser-check','about:blank'],{stdio:'ignore'});
          const timeout=setTimeout(()=>{chrome.kill();process.exit(1)},50000);
          let ws;
          try {
           let tabs;for(let i=0;i<100;i++){try{tabs=await(await fetch('http://127.0.0.1:9358/json')).json();break;}catch{await new Promise(r=>setTimeout(r,100));}}
           ws=new WebSocket(tabs.find(t=>t.type==='page').webSocketDebuggerUrl);await new Promise(r=>ws.addEventListener('open',r,{once:true}));let id=0;const pending=new Map();
           ws.addEventListener('message',e=>{const m=JSON.parse(e.data);if(pending.has(m.id)){const {res,rej}=pending.get(m.id);pending.delete(m.id);m.error?rej(m.error):res(m.result);}});
           const send=(method,params={})=>new Promise((res,rej)=>{pending.set(++id,{res,rej});ws.send(JSON.stringify({id,method,params}));});
           await send('Page.enable');
           const nav=await send('Page.navigate',{url:'https://www.ameli.fr/entreprise/vos-salaries/arret-de-travail/subrogation-salaire'});
           await new Promise(r=>setTimeout(r,10000));
           const result=await send('Runtime.evaluate',{expression:'({url:location.href,title:document.title,html:document.documentElement.outerHTML})',returnByValue:true});
           writeFileSync('source-access/ameli-browser.json',JSON.stringify(result.result.value));
           console.log(JSON.stringify({navigationError:nav.errorText,title:result.result.value?.title,bytes:result.result.value?.html.length}));
          } finally {clearTimeout(timeout);ws?.close();chrome.kill();await new Promise(r=>chrome.once('exit',r));rmSync(profile,{recursive:true,force:true});}
          JAVASCRIPT
          node /tmp/browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: documentary-source-access
          path: source-access/
          retention-days: 3
