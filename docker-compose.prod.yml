# AORIA RH — Docker Compose PRODUCTION
#
# Utilisation :
#   docker-compose -f docker-compose.prod.yml up -d
#
# Différences avec docker-compose.yml (dev) :
#   - Caddy en reverse proxy (HTTPS automatique)
#   - Ports backend/frontend non exposés (cachés derrière Caddy)
#   - Ports DB/Qdrant/MinIO non exposés (accès interne uniquement)
#   - Variables d'environnement production (pas de défauts faibles)
#
# Prérequis :
#   - Créer un fichier .env à la racine avec toutes les variables (voir TODO_PRODUCTION.md section 1)
#   - Les domaines app.aoriarh.fr et api.aoriarh.fr doivent pointer vers le serveur

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - aoriarh

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Pas de ports exposés — accès interne uniquement
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aoriarh

  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    # Pas de ports exposés — accès interne uniquement
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aoriarh

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    # Pas de ports exposés — accès interne uniquement
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aoriarh

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aoriarh

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    labels:
      logging: "promtail"
    environment:
      POSTGRES_HOST: postgres
      APP_ENV: production
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-aoriarh-documents}
      MINIO_USE_SSL: "false"
      SECRET_KEY: ${SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_LIST_ID: ${BREVO_LIST_ID:-0}
      BREVO_WEBHOOK_SECRET: ${BREVO_WEBHOOK_SECRET:-}
      API_BASE_URL: ${API_BASE_URL:-https://api.aoriarh.fr}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TOOL_USAGE_NOTIFICATIONS_ENABLED: ${TOOL_USAGE_NOTIFICATIONS_ENABLED:-true}
      TOOL_USAGE_NOTIFICATION_EMAIL: ${TOOL_USAGE_NOTIFICATION_EMAIL:-vanessa@aoriarh.fr}
      TOOL_USAGE_ALLOWED_ORIGINS: ${TOOL_USAGE_ALLOWED_ORIGINS:-https://aoriarh.fr}
      TOOL_USAGE_TURNSTILE_HOSTNAMES: ${TOOL_USAGE_TURNSTILE_HOSTNAMES:-aoriarh.fr}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_ADMIN: ${SEED_ADMIN:-false}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      REDIS_URL: redis://redis:6379
      LOG_FORMAT: json
      WORKERS: ${WORKERS:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-8}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-4}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-10}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-200}
      JUDILIBRE_CLIENT_ID: ${JUDILIBRE_CLIENT_ID:-}
      JUDILIBRE_CLIENT_SECRET: ${JUDILIBRE_CLIENT_SECRET:-}
      JUDILIBRE_BASE_URL: ${JUDILIBRE_BASE_URL:-https://api.piste.gouv.fr/cassation/judilibre/v1.0}
      JUDILIBRE_OAUTH_URL: ${JUDILIBRE_OAUTH_URL:-https://oauth.piste.gouv.fr/api/oauth/token}
      # Stripe (commercial plans). Empty values disable /billing endpoints.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_SOLO_MONTHLY: ${STRIPE_PRICE_SOLO_MONTHLY:-}
      STRIPE_PRICE_SOLO_YEARLY: ${STRIPE_PRICE_SOLO_YEARLY:-}
      STRIPE_PRICE_EQUIPE_MONTHLY: ${STRIPE_PRICE_EQUIPE_MONTHLY:-}
      STRIPE_PRICE_EQUIPE_YEARLY: ${STRIPE_PRICE_EQUIPE_YEARLY:-}
      STRIPE_PRICE_GROUPE_MONTHLY: ${STRIPE_PRICE_GROUPE_MONTHLY:-}
      STRIPE_PRICE_GROUPE_YEARLY: ${STRIPE_PRICE_GROUPE_YEARLY:-}
      STRIPE_PRICE_ADDON_USER: ${STRIPE_PRICE_ADDON_USER:-}
      STRIPE_PRICE_ADDON_ORG: ${STRIPE_PRICE_ADDON_ORG:-}
      STRIPE_PRICE_ADDON_DOCS: ${STRIPE_PRICE_ADDON_DOCS:-}
      STRIPE_PRICE_BOOSTER: ${STRIPE_PRICE_BOOSTER:-}
      STRIPE_CHECKOUT_SUCCESS_URL: ${STRIPE_CHECKOUT_SUCCESS_URL:-}
      STRIPE_CHECKOUT_CANCEL_URL: ${STRIPE_CHECKOUT_CANCEL_URL:-}
      STRIPE_PORTAL_RETURN_URL: ${STRIPE_PORTAL_RETURN_URL:-}
    # Pas de ports exposés — accès via Caddy uniquement
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 4G
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aoriarh

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "arq", "app.worker.WorkerSettings"]
    labels:
      logging: "promtail"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-aoriarh-documents}
      MINIO_USE_SSL: "false"
      SECRET_KEY: ${SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_LIST_ID: ${BREVO_LIST_ID:-0}
      API_BASE_URL: ${API_BASE_URL:-https://api.aoriarh.fr}
      REDIS_URL: redis://redis:6379
      JUDILIBRE_CLIENT_ID: ${JUDILIBRE_CLIENT_ID:-}
      JUDILIBRE_CLIENT_SECRET: ${JUDILIBRE_CLIENT_SECRET:-}
      JUDILIBRE_BASE_URL: ${JUDILIBRE_BASE_URL:-https://api.piste.gouv.fr/cassation/judilibre/v1.0}
      JUDILIBRE_OAUTH_URL: ${JUDILIBRE_OAUTH_URL:-https://oauth.piste.gouv.fr/api/oauth/token}
      # Stripe (commercial plans). Worker only needs the secret key to read
      # subscription state and for the billing lifecycle cron job.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_SOLO_MONTHLY: ${STRIPE_PRICE_SOLO_MONTHLY:-}
      STRIPE_PRICE_SOLO_YEARLY: ${STRIPE_PRICE_SOLO_YEARLY:-}
      STRIPE_PRICE_EQUIPE_MONTHLY: ${STRIPE_PRICE_EQUIPE_MONTHLY:-}
      STRIPE_PRICE_EQUIPE_YEARLY: ${STRIPE_PRICE_EQUIPE_YEARLY:-}
      STRIPE_PRICE_GROUPE_MONTHLY: ${STRIPE_PRICE_GROUPE_MONTHLY:-}
      STRIPE_PRICE_GROUPE_YEARLY: ${STRIPE_PRICE_GROUPE_YEARLY:-}
      STRIPE_PRICE_ADDON_USER: ${STRIPE_PRICE_ADDON_USER:-}
      STRIPE_PRICE_ADDON_ORG: ${STRIPE_PRICE_ADDON_ORG:-}
      STRIPE_PRICE_ADDON_DOCS: ${STRIPE_PRICE_ADDON_DOCS:-}
      STRIPE_PRICE_BOOSTER: ${STRIPE_PRICE_BOOSTER:-}
      LOG_FORMAT: json
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-10}
      WORKER_DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-4}
      WORKER_DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-4}
      WORKER_MAX_JOBS: ${WORKER_MAX_JOBS:-3}
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 1G
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aoriarh

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MARKETING_URL: ${NEXT_PUBLIC_MARKETING_URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_GA4_ID: ${NEXT_PUBLIC_GA4_ID:-}
        NEXT_PUBLIC_ADS_ID: ${NEXT_PUBLIC_ADS_ID:-}
        NEXT_PUBLIC_ADS_LABEL_ESSAI: ${NEXT_PUBLIC_ADS_LABEL_ESSAI:-}
        NEXT_PUBLIC_ADS_LABEL_DEMO: ${NEXT_PUBLIC_ADS_LABEL_DEMO:-}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_MARKETING_URL: ${NEXT_PUBLIC_MARKETING_URL}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NEXT_PUBLIC_GA4_ID: ${NEXT_PUBLIC_GA4_ID:-}
      NEXT_PUBLIC_ADS_ID: ${NEXT_PUBLIC_ADS_ID:-}
      NEXT_PUBLIC_ADS_LABEL_ESSAI: ${NEXT_PUBLIC_ADS_LABEL_ESSAI:-}
      NEXT_PUBLIC_ADS_LABEL_DEMO: ${NEXT_PUBLIC_ADS_LABEL_DEMO:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      INTERNAL_API_URL: http://backend:8000/api/v1
    # Pas de ports exposés — accès via Caddy uniquement
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    depends_on:
      - backend
    networks:
      - aoriarh

  # --- Monitoring ---

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - aoriarh

  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
        reservations:
          cpus: "0.1"
          memory: 256M
    networks:
      - aoriarh

  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    networks:
      - aoriarh

  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://monitoring.aoriarh.fr
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.1"
          memory: 128M
    depends_on:
      - prometheus
      - loki
    networks:
      - aoriarh

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  qdrant_data:
  minio_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  aoriarh:
    driver: bridge
